<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>belajarhukum – Prosedur Pendirian Badan Hukum</title>
<style>
:root{--bg:#f4faff;--card:#fff;--ink:#12324a;--mut:#5b7a92;--pri:#2f9be0;--soft:#dff1ff;--line:#cfe6f7;--ok:#1e9e6a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b27;--card:#14283a;--ink:#e6f3fc;--mut:#9ab9cf;--soft:#1b3a52;--line:#24455f}}
:root[data-theme="dark"]{--bg:#0e1b27;--card:#14283a;--ink:#e6f3fc;--mut:#9ab9cf;--soft:#1b3a52;--line:#24455f}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:linear-gradient(135deg,#8fd0ff,#e8f6ff);padding:14px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.logo{font-weight:800;font-size:22px;color:#0b3a5c}.logo b{color:#fff;background:#2f9be0;border-radius:8px;padding:0 7px;margin-right:6px}
nav{display:flex;gap:6px;margin-top:10px;overflow-x:auto}
nav button{border:0;background:rgba(255,255,255,.7);color:#0b3a5c;padding:8px 14px;border-radius:20px;font-weight:600;cursor:pointer;white-space:nowrap}
nav button.on{background:#2f9be0;color:#fff}
main{max-width:860px;margin:0 auto;padding:16px}
.hero{background:linear-gradient(160deg,var(--soft),var(--card));border:1px solid var(--line);border-radius:20px;padding:22px;text-align:center}
.hero h1{margin:8px 0;font-size:26px}.hero p{color:var(--mut);margin:0 0 14px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:12px;padding:11px 18px;font-weight:700;cursor:pointer;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;text-align:center;transition:.15s}
.card:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(47,155,224,.2)}
.card h3{margin:6px 0 2px;font-size:16px}.card small{color:var(--mut)}
.pills{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.pill{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:16px;cursor:pointer;white-space:nowrap}
.pill.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.ill{border-radius:14px;overflow:hidden;background:var(--soft);margin-bottom:12px}
.bar{height:8px;background:var(--soft);border-radius:8px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--pri);transition:.3s}
.step{border:1px solid var(--line);border-radius:14px;margin:8px 0;overflow:hidden}
.step>div:first-child{display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer}
.num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--pri);display:grid;place-items:center;font-weight:800}
.step.done .num{background:var(--ok);color:#fff}
.step .d{display:none;padding:0 12px 12px 52px;color:var(--mut);font-size:15px}.step.open .d{display:block}
.step .d label{display:block;margin-top:8px;color:var(--ink);cursor:pointer}
h2{margin:6px 0 8px;font-size:20px}h4{margin:12px 0 4px}
ul{padding-left:20px;margin:4px 0}
input[type=search]{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;margin-bottom:10px}
.reg b{color:var(--pri)}.reg{padding:10px 0;border-bottom:1px solid var(--line)}.reg:last-child{border:0}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:15px}
.opt.ok{background:#d6f5e6;border-color:var(--ok);color:#0b4a30}.opt.no{background:#ffe0e0;border-color:#e55;color:#5a1010}
.note{font-size:13px;color:var(--mut);margin-top:16px;text-align:center}
</style></head><body>
<header><div class="logo"><b>§</b>belajarhukum</div>
<nav id="nav"></nav></header>
<main id="m"></main>
<script>
const E=[
{id:'pt',n:'PT',f:'Perseroan Terbatas',c:'#2f9be0',d:'Badan hukum persekutuan modal dengan modal dasar terbagi atas saham, minimal 2 pendiri.',
 s:[['Siapkan data & pesan nama','Tentukan nama (min. 3 kata), maksud tujuan, KBLI, modal dasar, modal disetor, susunan direksi & komisaris, alamat. Ajukan nama lewat AHU Online (sahdb.ahu.go.id).'],['Akta pendirian di notaris','Para pendiri menghadap notaris. Akta dibuat dalam bahasa Indonesia dan ditandatangani pendiri.'],['Pengesahan Kemenkum (AHU Online)','Notaris mengajukan permohonan pengesahan secara elektronik. SK pengesahan terbit dan PT berstatus badan hukum.'],['NPWP & NIB (OSS)','Daftar NIB melalui OSS RBA untuk perizinan berusaha sesuai tingkat risiko KBLI.'],['Pendaftaran lanjutan','Daftar BPJS, pelaporan Wajib Lapor Ketenagakerjaan, pelaporan pemilik manfaat (beneficial owner) dan rekening perusahaan.']],
 dk:['KTP & NPWP seluruh pendiri','Data direksi & komisaris','Alamat domisili usaha','Pilihan KBLI','Rencana modal'],
 r:[['UU No. 40 Tahun 2007','Perseroan Terbatas, sebagaimana diubah UU 6/2023 (Cipta Kerja)'],['PP No. 8 Tahun 2021','Modal dasar Perseroan serta pendaftaran pendirian, perubahan & pembubaran'],['Permenkumham No. 21 Tahun 2021','Syarat & tata cara pendirian, perubahan, pembubaran PT'],['Perpres No. 13 Tahun 2018','Pelaksanaan prinsip mengenali pemilik manfaat']]},
{id:'ptp',n:'PT Perorangan',f:'PT untuk UMK',c:'#1fa8b8',d:'PT dengan 1 pendiri khusus Usaha Mikro dan Kecil, cukup dengan surat pernyataan pendirian tanpa akta notaris.',
 s:[['Pastikan memenuhi kriteria UMK','WNI, usia minimal 17 tahun, cakap hukum, hanya 1 orang sebagai pemegang saham sekaligus direksi.'],['Isi formulir pernyataan pendirian','Lengkapi Surat Pernyataan Pendirian elektronik di AHU Online berbahasa Indonesia, termasuk modal dasar dan KBLI.'],['Terbit sertifikat pendaftaran','Setelah pengisian dan pembayaran PNBP, sertifikat pendaftaran elektronik terbit, PT Perorangan berstatus badan hukum.'],['NIB & izin usaha','Daftar NIB melalui OSS RBA.']],
 dk:['KTP & NPWP pendiri','Alamat usaha','KBLI usaha mikro/kecil','Email aktif'],
 r:[['UU No. 6 Tahun 2023','Penetapan Perppu Cipta Kerja, mengatur PT Perorangan'],['PP No. 8 Tahun 2021','Pendirian PT untuk UMK'],['Permenkumham No. 21 Tahun 2021','Tata cara pendirian PT Perorangan']]},
{id:'cv',n:'CV',f:'Persekutuan Komanditer',c:'#4a7de0',d:'Persekutuan dengan sekutu aktif (pengurus) dan sekutu pasif (komanditer). CV bukan badan hukum.',
 s:[['Tentukan sekutu & nama CV','Minimal 2 orang: sekutu aktif dan sekutu komanditer. Cek nama dan KBLI.'],['Akta pendirian di notaris','Dibuat dalam akta notaris yang memuat nama, kegiatan, modal, dan pembagian tugas sekutu.'],['Daftar ke Sistem Administrasi Badan Usaha','Notaris mendaftarkan akta di AHU Online untuk memperoleh surat keterangan terdaftar.'],['NPWP & NIB','Daftar NPWP badan dan NIB di OSS RBA.']],
 dk:['KTP & NPWP semua sekutu','Alamat usaha','Kegiatan usaha (KBLI)','Besaran modal sekutu'],
 r:[['KUHD Pasal 19–21','Persekutuan komanditer'],['KUH Perdata Pasal 1618 dst.','Persekutuan perdata'],['Permenkumham No. 17 Tahun 2018','Pendaftaran persekutuan komanditer, firma & persekutuan perdata']]},
{id:'yy',n:'Yayasan',f:'Badan sosial, keagamaan, kemanusiaan',c:'#6a6ae0',d:'Badan hukum dengan kekayaan terpisah untuk tujuan sosial, keagamaan, dan kemanusiaan, tidak membagi laba.',
 s:[['Siapkan pendiri & kekayaan awal','Satu atau lebih pendiri; kekayaan awal dipisahkan dari pendiri. Pesan nama yayasan di AHU Online.'],['Akta pendirian di notaris','Memuat anggaran dasar, organ yayasan (pembina, pengurus, pengawas) dan kekayaan awal.'],['Pengesahan Kemenkum','Notaris mengajukan permohonan; pengesahan menjadikan yayasan badan hukum.'],['Pengumuman & NPWP','Pengumuman dalam Tambahan Berita Negara RI, lalu NPWP dan NIB sesuai kegiatan.']],
 dk:['KTP pendiri','Bukti kekayaan awal','Susunan pembina, pengurus, pengawas','Maksud dan tujuan'],
 r:[['UU No. 16 Tahun 2001','Yayasan, diubah UU 28/2004'],['PP No. 63 Tahun 2008','Pelaksanaan UU Yayasan'],['Permenkumham No. 2 Tahun 2016','Tata cara pengajuan pengesahan badan hukum yayasan']]},
{id:'kop',n:'Koperasi',f:'Badan usaha gotong royong',c:'#27a972',d:'Badan usaha beranggotakan orang atau badan hukum koperasi yang berasaskan kekeluargaan.',
 s:[['Rapat pembentukan','Minimal 9 orang pendiri (koperasi primer) mengadakan rapat membahas anggaran dasar dan pengurus.'],['Akta pendirian di notaris','Notaris pembuat akta koperasi menyusun akta pendirian dan anggaran dasar.'],['Pengesahan melalui SIMKOPDIT/AHU','Pengajuan pengesahan status badan hukum koperasi secara elektronik oleh notaris.'],['NIK koperasi & NIB','Daftar NIK Koperasi, NPWP, dan NIB di OSS RBA.']],
 dk:['KTP minimal 9 pendiri','Notulen rapat pembentukan','Susunan pengurus & pengawas','Simpanan pokok & wajib'],
 r:[['UU No. 25 Tahun 1992','Perkoperasian, diubah UU 6/2023'],['PP No. 7 Tahun 2021','Kemudahan, pelindungan, dan pemberdayaan Koperasi & UMKM'],['Permenkop UKM No. 9 Tahun 2018','Penyelenggaraan dan pembinaan perkoperasian']]},
{id:'pk',n:'Perkumpulan',f:'Organisasi berbadan hukum',c:'#e0883a',d:'Kumpulan orang untuk tujuan nonkomersial. Bisa berbadan hukum bila disahkan Kemenkum.',
 s:[['Kumpulkan pendiri','Minimal 3 orang pendiri; tentukan nama, tujuan, dan pengurus.'],['Akta notaris','Akta pendirian beserta anggaran dasar.'],['Pengesahan AHU Online','Notaris mengajukan pengesahan badan hukum perkumpulan.'],['Pendaftaran Ormas / NPWP','Bila ormas, daftar SKT dan NPWP.']],
 dk:['KTP pendiri','Anggaran dasar','Alamat sekretariat','Susunan pengurus'],
 r:[['Staatsblad 1870-64','Perkumpulan-perkumpulan berbadan hukum'],['Permenkumham No. 3 Tahun 2016','Tata cara pengajuan permohonan pengesahan badan hukum perkumpulan'],['UU No. 16 Tahun 2017','Organisasi Kemasyarakatan']]},
{id:'ntr',n:'Notaris',f:'Peran & jabatan',c:'#d9567a',d:'Pejabat umum yang berwenang membuat akta otentik. Hampir semua pendirian badan hukum melalui notaris.',
 s:[['Konsultasi','Klien menyampaikan jenis badan hukum, pendiri, modal, dan tujuan.'],['Pengecekan nama di AHU','Notaris memeriksa dan memesan nama badan hukum.'],['Penandatanganan akta','Pembacaan akta di hadapan para pihak dan saksi lalu ditandatangani.'],['Input & pengesahan elektronik','Akta didaftarkan; salinan akta dan SK diserahkan ke klien.']],
 dk:['Identitas para pihak','Draf data badan hukum','Biaya notaris & PNBP'],
 r:[['UU No. 30 Tahun 2004','Jabatan Notaris'],['UU No. 2 Tahun 2014','Perubahan UU Jabatan Notaris'],['Permenkumham No. 62 Tahun 2016','Tata cara pengangkatan notaris']]}
];
const Q=[['PT Perorangan didirikan dengan...',['Akta notaris','Surat pernyataan pendirian elektronik','Rapat 9 orang'],1],['Berapa minimal pendiri koperasi primer?',['3','9','20'],1],['Peraturan utama Yayasan adalah...',['UU 16/2001','UU 40/2007','UU 25/1992'],0],['CV berstatus...',['Badan hukum','Bukan badan hukum','Koperasi'],1],['Sistem pengesahan badan hukum disebut...',['AHU Online','SIPP','e-Filing'],0]];
const $=s=>document.querySelector(s),m=$('#m');let cur='home',sel='pt',done={};
try{done=JSON.parse(localStorage.getItem('bh')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('bh',JSON.stringify(done))}catch(e){}};
const ill=e=>`<svg viewBox="0 0 400 130" width="100%" role="img" aria-label="Ilustrasi ${e.n}"><rect width="400" height="130" fill="none"/><circle cx="60" cy="100" r="60" fill="#fff" opacity=".5"/><circle cx="350" cy="20" r="45" fill="#fff" opacity=".5"/><rect x="140" y="22" width="120" height="92" rx="8" fill="#fff" stroke="${e.c}" stroke-width="3"/><rect x="156" y="40" width="70" height="6" rx="3" fill="${e.c}" opacity=".5"/><rect x="156" y="54" width="88" height="6" rx="3" fill="${e.c}" opacity=".3"/><rect x="156" y="68" width="60" height="6" rx="3" fill="${e.c}" opacity=".3"/><circle cx="236" cy="96" r="20" fill="${e.c}"/><text x="236" y="102" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">${e.n[0]}</text><path d="M60 110v-40l30-18 30 18v40z" fill="${e.c}" opacity=".75"/><rect x="82" y="86" width="16" height="24" fill="#fff"/><path d="M300 60l12 12 24-26" stroke="${e.c}" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="14" text-anchor="middle" font-size="12" font-weight="700" fill="${e.c}">${e.f}</text></svg>`;
function nav(){const t=[['home','Beranda'],['pro','Prosedur'],['ahu','Isi Data AHU'],['reg','Peraturan'],['quiz','Kuis']];$('#nav').innerHTML=t.map(x=>`<button class="${cur==x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}
function go(v,id){cur=v;if(id)sel=id;nav();render();scrollTo(0,0)}
function render(){({home,pro,ahu,reg,quiz})[cur]()}
function home(){m.innerHTML=`<div class="hero"><svg viewBox="0 0 80 80" width="80"><circle cx="40" cy="40" r="38" fill="#2f9be0"/><path d="M40 16v44M24 60h32M20 28h40M26 28l-8 18h16zM54 28l-8 18h16z" stroke="#fff" stroke-width="3.5" fill="none" stroke-linejoin="round"/></svg><h1>Belajar Prosedur Hukum Indonesia</h1><p>Panduan interaktif pendirian badan hukum lewat AHU Online & notaris.</p><button class="btn" onclick="go('pro')">Mulai Belajar</button></div><div class="grid">${E.map(e=>`<div class="card" onclick="go('pro','${e.id}')"><svg viewBox="0 0 60 60" width="56"><circle cx="30" cy="30" r="28" fill="${e.c}" opacity=".15"/><rect x="16" y="12" width="28" height="36" rx="4" fill="#fff" stroke="${e.c}" stroke-width="3"/><path d="M22 24h16M22 31h16M22 38h9" stroke="${e.c}" stroke-width="3" stroke-linecap="round"/></svg><h3>${e.n}</h3><small>${e.f}</small></div>`).join('')}</div><p class="note">Materi bersifat edukasi. Pastikan memeriksa peraturan terbaru dan konsultasikan dengan notaris.</p>`}
function pro(){const e=E.find(x=>x.id==sel),k=e.id,d=done[k]||{},n=e.s.length,c=Object.keys(d).filter(i=>d[i]).length;
m.innerHTML=`<div class="pills">${E.map(x=>`<button class="pill ${x.id==sel?'on':''}" onclick="go('pro','${x.id}')">${x.n}</button>`).join('')}</div><div class="panel"><div class="ill">${ill(e)}</div><h2>Pendirian ${e.n} – ${e.f}</h2><p>${e.d}</p><div class="bar"><i style="width:${c/n*100}%"></i></div><small>${c} dari ${n} langkah dipelajari</small>
<h4>Langkah-langkah (ketuk untuk detail)</h4>${e.s.map((s,i)=>`<div class="step ${d[i]?'done':''}" id="s${i}"><div onclick="this.parentNode.classList.toggle('open')"><span class="num">${d[i]?'✓':i+1}</span><b>${s[0]}</b></div><div class="d">${s[1]}<label><input type="checkbox" ${d[i]?'checked':''} onchange="tick('${k}',${i},this.checked)"> Saya sudah paham</label></div></div>`).join('')}
<h4>Dokumen yang disiapkan</h4><ul>${e.dk.map(x=>`<li>${x}</li>`).join('')}</ul><h4>Dasar hukum</h4>${e.r.map(r=>`<div class="reg"><b>${r[0]}</b><br>${r[1]}</div>`).join('')}</div>`}
function tick(k,i,v){(done[k]=done[k]||{})[i]=v;save();const y=scrollY;pro();scrollTo(0,y);document.getElementById('s'+i).classList.add('open')}
const AC=['Login akun notaris di AHU Online (ahu.go.id), pilih layanan sesuai jenis badan hukum.','Pastikan data pendiri (NIK, NPWP, alamat) sama persis dengan akta.'];
const A={
pt:[['Pemesanan nama','Pilih menu Perseroan > Pengajuan Nama. Isi 1–3 alternatif nama (min. 3 kata), lalu bayar PNBP. Nama yang disetujui umumnya berlaku 60 hari untuk dipakai mendaftar.'],['Data akta pendirian','Nomor & tanggal akta, nama notaris, nama PT, kedudukan, jangka waktu, maksud & tujuan, KBLI 5 digit, modal dasar, modal ditempatkan & disetor, alamat lengkap (provinsi s.d. kode pos), email, telepon, NPWP perseroan.'],['Pemegang saham','NIK/paspor, nama, alamat, jumlah saham, nilai nominal, persentase. Untuk pemegang saham badan hukum, isi data badan hukumnya.'],['Direksi & komisaris','NIK, nama, jabatan, NPWP, alamat, tanggal mulai jabatan.'],['Pemilik manfaat','Isi data beneficial owner sesuai Perpres 13/2018 (kepemilikan, kendali, atau manfaat atas korporasi).'],['Unggah & bayar','Unggah akta (PDF), pernyataan elektronik, bayar PNBP lewat kode billing. Unduh SK pengesahan dan akta setelah terbit.']],
ptp:[['Registrasi pendiri','Pendiri mengisi sendiri lewat AHU Online (tanpa notaris). Isi NIK, nama, email, nomor HP; verifikasi data kependudukan.'],['Pernyataan pendirian','Nama, kedudukan, alamat, KBLI, modal dasar & disetor, data direksi (sama dengan pemegang saham tunggal).'],['Bayar & sertifikat','Bayar PNBP lalu unduh sertifikat pendaftaran elektronik.']],
cv:[['Pemesanan nama','Menu Persekutuan Komanditer > Pengajuan Nama; bayar PNBP.'],['Data akta','Nomor & tanggal akta, nama notaris, nama CV, kedudukan, alamat, KBLI, modal, jangka waktu.'],['Data sekutu','NIK, nama, alamat, peran (sekutu aktif/komanditer), besar pemasukan modal.'],['Pendaftaran','Unggah akta, bayar PNBP, unduh surat keterangan terdaftar. Ingat: CV hanya terdaftar, bukan badan hukum.']],
yy:[['Pemesanan nama','Menu Yayasan > Pengajuan Nama. Nama tidak boleh sama atau mirip yayasan lain.'],['Data akta & yayasan','Nomor & tanggal akta, nama yayasan, kedudukan, alamat, maksud & tujuan, kegiatan, jangka waktu, kekayaan awal (nominal & bentuk).'],['Organ yayasan','Data pendiri, pembina, pengurus (ketua, sekretaris, bendahara), dan pengawas lengkap dengan NIK dan NPWP.'],['Unggah, bayar, SK','Unggah akta, surat pernyataan tempat kedudukan, bukti kekayaan; bayar PNBP, unduh SK pengesahan.']],
kop:[['Persiapan data','Siapkan notulen rapat pembentukan, daftar 9+ pendiri, jenis koperasi, dan simpanan pokok.'],['Pengajuan nama & akta','Ajukan nama koperasi, isi data akta, tempat kedudukan, bidang usaha, modal sendiri (simpanan pokok, wajib).'],['Pengurus & pengawas','Isi NIK, jabatan, alamat pengurus dan pengawas serta anggota pendiri.'],['Pengesahan','Unggah dokumen, bayar PNBP bila ada, unduh SK pengesahan lalu daftarkan NIK Koperasi.']],
pk:[['Pemesanan nama','Menu Perkumpulan > Pengajuan Nama; bayar PNBP.'],['Data akta','Nomor & tanggal akta, nama, kedudukan, maksud & tujuan, kegiatan, alamat sekretariat.'],['Pengurus & pendiri','Data min. 3 pendiri dan susunan pengurus (NIK, jabatan, alamat).'],['Unggah & SK','Unggah akta dan dokumen pendukung, bayar PNBP, unduh SK pengesahan.']]};
function ahu(){const k=A[sel]?sel:'pt',e=E.find(x=>x.id==k);m.innerHTML=`<div class="pills">${E.filter(x=>A[x.id]).map(x=>`<button class="pill ${x.id==k?'on':''}" onclick="go('ahu','${x.id}')">${x.n}</button>`).join('')}</div><div class="panel"><div class="ill">${ill(e)}</div><h2>Panduan isi data AHU Online – ${e.n}</h2><p>Alur kerja notaris pada sistem Ditjen AHU, urut dari login sampai terbit SK.</p><h4>Sebelum mulai</h4><ul>${AC.map(x=>`<li>${x}</li>`).join('')}</ul><h4>Tahapan input</h4>${A[k].map((s,i)=>`<div class="step ${i==0?'open':''}"><div onclick="this.parentNode.classList.toggle('open')"><span class="num">${i+1}</span><b>${s[0]}</b></div><div class="d">${s[1]}</div></div>`).join('')}<p class="note">Tampilan menu, nama layanan, dan tarif PNBP dapat berubah. Cocokkan dengan petunjuk resmi di ahu.go.id.</p></div>`}
function reg(){m.innerHTML=`<h2>Daftar Peraturan</h2><input type="search" id="q" placeholder="Cari peraturan atau jenis badan hukum..." oninput="fr()"><div class="panel" id="rl"></div>`;fr()}
function fr(){const q=($('#q').value||'').toLowerCase(),o=[];E.forEach(e=>e.r.forEach(r=>{if((e.n+r[0]+r[1]).toLowerCase().includes(q))o.push(`<div class="reg"><b>${r[0]}</b> <small>· ${e.n}</small><br>${r[1]}</div>`)}));$('#rl').innerHTML=o.join('')||'Tidak ditemukan.'}
let qi=0,sc=0;
function quiz(){if(qi>=Q.length){m.innerHTML=`<div class="panel" style="text-align:center"><h2>Skor kamu: ${sc}/${Q.length}</h2><p>${sc>=4?'Hebat! Kamu sudah menguasai dasarnya.':'Ayo pelajari lagi bagian Prosedur.'}</p><button class="btn" onclick="qi=0;sc=0;quiz()">Ulangi</button></div>`;return}
const q=Q[qi];m.innerHTML=`<div class="panel"><small>Pertanyaan ${qi+1}/${Q.length}</small><h2>${q[0]}</h2>${q[1].map((o,i)=>`<button class="opt" onclick="ans(this,${i})">${o}</button>`).join('')}</div>`}
function ans(b,i){const q=Q[qi],bs=[...document.querySelectorAll('.opt')];if(bs[0].disabled)return;bs.forEach(x=>x.disabled=true);bs[q[2]].classList.add('ok');if(i==q[2])sc++;else b.classList.add('no');setTimeout(()=>{qi++;quiz()},1000)}
nav();render();
</script></body></html>
